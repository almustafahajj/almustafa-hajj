<!doctype html>
<html lang="ar" dir="rtl"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#072A20">
<link rel="icon" type="image/png" sizes="192x192" href="{{ url_for('static', filename='icons/icon-192.png') }}">
<title>شاشة المكتب — {{ co_name }}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head><body class="mode-umrah tv-body">
{% include "_sky.html" %}
<header class="tv-top">
  <div class="tv-brand"><img src="{{ url_for('static', filename='icons/icon-192.png') }}" alt=""><span>{{ co_name }}</span></div>
  <div class="tv-now"><b id="tvClock" dir="ltr">--:--</b><span id="tvDate"></span></div>
</header>
<main class="tv-stage" id="tvStage" aria-live="polite">
  <section class="tv-slide on" data-kind="clock">
    <div class="tv-bigclock" dir="ltr" id="tvBig">--:--</div>
    <p class="tv-greg" id="tvGreg"></p>
    <p class="tv-hijri" id="tvHijri"></p>
    <div class="tv-pray" id="tvPray" hidden><span>{{ ic('kaaba') }} الصلاة القادمة في مكة</span><b id="tvPName">—</b><small id="tvPTime">--:--</small></div>
  </section>
</main>
<footer class="tv-foot"><div class="tv-dots" id="tvDots"></div><span id="tvUpd"></span></footer>
<script type="application/json" id="tvCfg">{{ {'url': data_url}|tojson }}</script>
<script src="{{ url_for('static', filename='tv.js') }}?v=2" defer></script>
</body></html>
