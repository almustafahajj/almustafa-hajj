{# اختيار النظام (حج/عمرة) بزرّين ملوّنين — العمرة أولاً وهي الافتراضية.
   يغيّر لون الصفحة وأيقونتها فوراً عند الاختيار. يحتاج: modes, selected_mode #}
<div class="field">
  <label id="modeLbl">النظام</label>
  <div class="mode-pick" role="radiogroup" aria-labelledby="modeLbl">
    {% for val,lbl,icon in modes %}
    <label class="mode-opt mode-{{ val }}">
      <input type="radio" name="mode" value="{{ val }}" data-icon="{{ icon }}"
             {% if val == selected_mode %}checked{% endif %}>
      <span>{{ icon }} {{ lbl }}</span>
    </label>
    {% endfor %}
  </div>
</div>
<script>
(function(){
  var dot = document.getElementById('modeIcon');
  function apply(r){
    document.body.className = 'mode-' + r.value;
    if (dot) dot.textContent = r.getAttribute('data-icon') || '';
  }
  // المتصفّح قد يستعيد اختياراً سابقاً عند التحديث/الرجوع دون حدث change،
  // فيُطابَق لون الصفحة مع الزرّ المختار فعلاً عند التحميل وعند كل ظهور
  function sync(){
    var c = document.querySelector('input[name=mode]:checked');
    if (c) apply(c);
  }
  document.querySelectorAll('input[name=mode]').forEach(function(r){
    r.addEventListener('change', function(){ apply(r); });
  });
  sync();
  window.addEventListener('pageshow', sync);
})();
</script>
