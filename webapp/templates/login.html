<!doctype html>
<html lang="ar" dir="rtl"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الدخول — المصطفى للحج والعمرة</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head><body>
<div class="login-wrap">
  <form class="login-card" method="post">
    <div class="brand-dot">🕋</div>
    <h1>المصطفى للحج والعمرة</h1>
    <p class="sub">تسجيل الدخول إلى لوحة التحكم</p>
    {% if error %}<div class="err">{{ error }}</div>{% endif %}
    <div class="field">
      <label>الوضع</label>
      <select name="mode">
        {% for val,lbl in modes %}<option value="{{ val }}">{{ lbl }}</option>{% endfor %}
      </select>
    </div>
    <div class="field">
      <label>اسم المستخدم</label>
      <input name="username" autofocus autocomplete="username">
    </div>
    <div class="field">
      <label>كلمة المرور</label>
      <input name="password" type="password" autocomplete="current-password">
    </div>
    <label class="remember">
      <input type="checkbox" name="remember" value="1"> تذكّرني على هذا الجهاز
    </label>
    <button class="btn primary" type="submit">دخول</button>
    <p class="sub" style="margin-top:14px">
      <a href="{{ url_for('recover') }}">نسيت كلمة المرور؟ (استرداد المدير)</a></p>
  </form>
</div>
</body></html>
