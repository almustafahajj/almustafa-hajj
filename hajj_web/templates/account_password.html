{% extends "base.html" %}
{% block title %}تغيير كلمة المرور — برنامج موسم الحج{% endblock %}
{% block body %}
<header class="topbar">
  <div class="titles"><span class="app-title">برنامج موسم الحج</span></div>
  <div class="spacer"></div>
  <div class="user">
    <span class="who">👤 {{ username }} · {{ role }}</span>
    <a class="logout" href="{{ url_for('logout') }}">🚪 تسجيل الخروج</a>
  </div>
</header>
<main class="content">
  <div class="detail-head">
    <a class="back" href="{{ url_for('index') }}">→ رجوع إلى الكشف</a>
    <h1>🔑 تغيير كلمة المرور</h1>
  </div>
  <div class="cards">
    <section class="card">
      <p class="hint">بياناتك لن تتأثّر، ومفتاح الاسترداد يبقى صالحاً.</p>
      <form method="post" action="{{ url_for('account_password') }}" class="record-form">
        <div class="field"><label>كلمة المرور الحالية</label><input type="password" name="current" required></div>
        <div class="field"><label>كلمة المرور الجديدة</label><input type="password" name="password" required></div>
        <div class="field"><label>تأكيد كلمة المرور</label><input type="password" name="confirm" required></div>
        <button type="submit" class="btn-primary">حفظ</button>
      </form>
    </section>
  </div>
</main>
{% endblock %}
